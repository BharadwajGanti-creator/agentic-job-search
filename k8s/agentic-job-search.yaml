apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-job-search
  namespace: agentic-job-search
  labels:
    app: agentic-job-search

spec:
  replicas: 1

  selector:
    matchLabels:
      app: agentic-job-search

  template:
    metadata:
      labels:
        app: agentic-job-search

    spec:
      automountServiceAccountToken: false

      containers:
        - name: agentic-job-search
          image: bgdevopsacr2026.azurecr.io/agentic-job-search:IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          envFrom:
            - secretRef:
                name: agentic-job-search-secrets

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

---
apiVersion: v1
kind: Service
metadata:
  name: agentic-job-search
  namespace: agentic-job-search

spec:
  type: ClusterIP

  selector:
    app: agentic-job-search

  ports:
    - name: http
      port: 80
      targetPort: http
