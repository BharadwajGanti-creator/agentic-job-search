name: Daily job search
on:
  schedule:
    - cron: '0 6 * * *'      # 06:00 UTC daily
  workflow_dispatch:          # manual trigger for testing
permissions:
  contents: write
  id-token: write
             # required to commit the JSON back
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Login to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run agent using Key Vault secrets
        shell: bash
        run: |
          set -euo pipefail

          RESUME_PROFILE_JSON="$(az keyvault secret show \
            --vault-name devops-track-kv2026 \
            --name ResumeProfileJson \
            --query value \
            --output tsv)"

          GEMINI_API_KEY="$(az keyvault secret show \
            --vault-name devops-track-kv2026 \
            --name GeminiApiKey \
            --query value \
            --output tsv)"

          JOOBLE_API_KEY="$(az keyvault secret show \
            --vault-name devops-track-kv2026 \
            --name JoobleApiKey \
            --query value \
            --output tsv)"

          printf '%s' "$RESUME_PROFILE_JSON" > resume_profile.json

          export GEMINI_API_KEY
          export JOOBLE_API_KEY

          dotnet run -- cron

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wwwroot/latest_matches.json
          git diff --staged --quiet || git commit -m "Daily matches $(date -u +%F)"
          git push
